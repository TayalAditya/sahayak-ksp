name: Keep the live demo warm

# The AppSail backend and the QuickML model both go cold when nobody uses them. On 28 Oct 2026
# the first question after a quiet spell took 37 s and the next one 4 s. Every 10 minutes this
# asks the backend one real question, so the model wakes up too and visitors land on a warm app.
# It stops by itself after STOP_AFTER; move the date to keep it running.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  BACKEND: https://sahayak-backend-50043102650.development.catalystappsail.in
  FRONTEND: https://sahayak-frontend-xpsqtdps.onslate.in
  STOP_AFTER: "2026-11-15"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the backend, the model and the front end
        run: |
          if [ "$(date -u +%F)" \> "$STOP_AFTER" ]; then
            echo "Past $STOP_AFTER, not pinging."
            exit 0
          fi
          # Never fail the job: a failed scheduled run emails the repo owner every 10 minutes.
          curl -sS -m 90  -o /dev/null -w "health   %{http_code} in %{time_total}s\n" "$BACKEND/health" || echo "health   no answer"
          curl -sS -m 200 -o /dev/null -w "question %{http_code} in %{time_total}s\n" -G "$BACKEND/chat" \
            --data-urlencode "question=How many FIRs are there in total?" || echo "question no answer"
          curl -sS -m 60  -o /dev/null -w "frontend %{http_code} in %{time_total}s\n" "$FRONTEND" || echo "frontend no answer"
